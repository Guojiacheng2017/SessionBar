<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>SessionBar</title>
    <link rel="stylesheet" href="./vendor/splide/splide-core.min.css">
    <link rel="stylesheet" href="./tailwind.css">
    <link rel="stylesheet" href="./web.css">
</head>
<body class="bg-bg text-ink text-[14px] leading-relaxed overflow-x-hidden min-h-screen">

<div id="app" class="flex flex-col min-h-screen px-6 py-5 max-w-[1180px] mx-auto">

<section class="dashboard-page sessions-page" aria-label="Sessions dashboard">

    <!-- Header -->
    <div class="app-header">
        <h1 class="text-[17px] font-bold tracking-[-0.3px] text-ink-strong">SessionBar</h1>
        <div class="app-header-actions">
            <span id="port" class="connection-pill">offline</span>
        </div>
    </div>

    <!-- Status summary -->
    <div id="counts" aria-live="polite" aria-atomic="true"></div>

    <!-- Filter -->
    <div class="flex gap-2 items-center shrink-0">
        <input id="filter" type="text" placeholder="Filter projects, tasks, or types…" aria-label="Filter sessions"
            class="flex-1 px-3.5 py-2.5 bg-surface border border-border rounded-lg text-[13px] text-ink outline-none focus:border-accent/40 focus:ring-[3px] focus:ring-accent/10 transition">
        <span id="filter-hint" class="text-[12px] text-muted whitespace-nowrap"></span>
    </div>

    <section id="session-scene" class="session-scene shrink-0" aria-label="Sessions workspace">
      <div id="session-shell" class="session-shell">
        <div id="session-compact" class="session-compact" aria-live="polite" aria-label="Collapsed session summary"></div>
        <div id="session-content" class="session-content">
    <!-- Projects panel -->
    <div class="projects-panel panel-card border border-border rounded-xl bg-surface shrink-0 max-h-[180px] flex flex-col overflow-hidden">
        <div id="projects-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-surface-highlight">
            <span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">Projects</span>
        </div>
        <div id="projects-body" class="flex-1 overflow-y-auto thin-scroll"></div>
    </div>

    <!-- Body -->
    <div class="workspace session-workspace flex flex-col gap-3.5 flex-1 min-h-0 lg:flex-row">
        <!-- Sessions -->
        <div class="panel-card flex-1 min-h-0 border border-border rounded-xl bg-surface flex flex-col overflow-hidden">
            <div id="sessions-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-surface-highlight"><span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">All Sessions</span></div>
            <div id="sessions-body" class="flex-1 overflow-y-auto thin-scroll"></div>
        </div>
        <!-- Detail -->
        <div id="detail-panel" class="panel-card hidden lg:flex flex-[1.15] min-w-0 border border-border rounded-xl bg-surface flex-col overflow-hidden">
            <div id="detail-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-surface-highlight"><span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">Details</span></div>
            <div id="detail-body" class="flex-1 overflow-y-auto thin-scroll px-4 py-4"></div>
        </div>
    </div>
        </div>
      </div>
    </section>

</section>

    <!-- Providers -->
    <section class="dashboard-page providers-page" aria-label="Providers dashboard">
    <div id="providers-session-bar" class="providers-session-bar" aria-hidden="true"></div>
    <section id="providers-panel" class="providers-panel providers-card panel-card" aria-labelledby="providers-heading">
        <div id="providers-header" class="providers-header">
            <div>
                <h2 id="providers-heading" class="providers-heading">Providers</h2>
                <p id="providers-daily-usage" class="providers-description provider-daily-usage"><span class="daily-usage-label">Today</span><span class="daily-usage-empty">No usage data yet</span></p>
            </div>
            <div class="providers-header-actions">
                <div id="provider-usage-mode" class="provider-usage-mode" role="group" aria-label="Provider usage metric">
                    <button type="button" data-provider-usage-mode="token" aria-pressed="true">Token</button>
                    <button type="button" data-provider-usage-mode="cash" aria-pressed="false">Cash</button>
                    <button type="button" data-provider-usage-mode="percentage" aria-pressed="false">Percentage</button>
                </div>
                <span id="providers-status" class="providers-status">Loading</span>
            </div>
        </div>
        <div id="providers-body" class="providers-body"></div>
    </section>

    <!-- Footer -->
    <div id="footer" class="text-[11px] text-muted shrink-0 truncate"></div>
    <div id="copyright" class="text-[11px] text-muted/50 text-center shrink-0">&copy; 2026 SessionBar</div>

    </section>

</div>

<script src="./vendor/splide/splide.min.js"></script>
<script type="module" src="./dist/web/app.js"></script>
</body>
</html>
