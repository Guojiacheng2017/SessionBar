<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SessionBar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg:      '#08080d',
              surface: '#0f0f17',
              border:  '#1a1a26',
              muted:   '#5c5c6e',
              accent:  '#6289e0',
              green:   '#3ea87a',
              amber:   '#c59438',
              red:     '#d94a3e',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="./web.css">
</head>
<body class="bg-bg text-gray-200 text-[13px] leading-relaxed overflow-hidden h-screen">

<div id="app" class="flex flex-col h-screen px-6 py-5 gap-3.5 max-w-[1080px] mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between gap-4 shrink-0">
        <h1 class="text-[17px] font-bold tracking-[-0.3px] text-white">SessionBar</h1>
        <span id="port" class="mono text-[11px] text-green bg-green/10 border border-green/20 rounded-full px-2.5 py-1">offline</span>
    </div>

    <!-- Status summary -->
    <div id="counts" aria-live="polite" aria-atomic="true"></div>

    <!-- Filter -->
    <div class="flex gap-2 items-center shrink-0">
        <input id="filter" type="text" placeholder="Filter projects, tasks, or types…"
            class="flex-1 px-3 py-2 bg-surface border border-border rounded-lg text-[12px] text-gray-200 outline-none focus:border-accent/40 focus:ring-[3px] focus:ring-accent/10 transition">
        <span id="filter-hint" class="text-[11px] text-muted whitespace-nowrap"></span>
    </div>

    <!-- Projects panel -->
    <div class="projects-panel border border-border rounded-xl bg-surface shrink-0 max-h-[180px] flex flex-col overflow-hidden shadow-[0_12px_32px_rgba(0,0,0,0.12)]">
        <div id="projects-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-white/[0.015]">
            <span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">Projects</span>
        </div>
        <div id="projects-body" class="flex-1 overflow-y-auto thin-scroll"></div>
    </div>

    <!-- Body -->
    <div class="workspace flex flex-col gap-3.5 flex-1 min-h-0 lg:flex-row">
        <!-- Sessions -->
        <div class="flex-1 min-h-0 border border-border rounded-xl bg-surface flex flex-col overflow-hidden shadow-[0_12px_32px_rgba(0,0,0,0.12)]">
            <div id="sessions-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-white/[0.015]"><span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">All Sessions</span></div>
            <div id="sessions-body" class="flex-1 overflow-y-auto thin-scroll"></div>
        </div>
        <!-- Detail -->
        <div id="detail-panel" class="hidden lg:flex flex-[1.15] min-w-0 border border-border rounded-xl bg-surface flex-col overflow-hidden shadow-[0_12px_32px_rgba(0,0,0,0.12)]">
            <div id="detail-header" class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-border shrink-0 select-none bg-white/[0.015]"><span class="mono text-[10px] font-semibold text-muted uppercase tracking-[0.6px]">Details</span></div>
            <div id="detail-body" class="flex-1 overflow-y-auto thin-scroll px-4 py-4"></div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer" class="text-[11px] text-muted shrink-0 truncate"></div>
    <div class="text-[10px] text-muted/40 text-center shrink-0">&copy; 2026 SessionBar</div>

</div>

<script type="module" src="./dist/app.js"></script>
</body>
</html>
